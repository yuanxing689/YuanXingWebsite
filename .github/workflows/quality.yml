name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser behavior tests
        run: >-
          npx playwright test
          tests/e2e/baseline.spec.js
          tests/e2e/console.spec.js
          tests/e2e/history-navigation.spec.js
          tests/e2e/home-restoration.spec.js
          tests/e2e/persistent-chrome.spec.js
          tests/e2e/regressions.spec.js

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-behavior-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run visual regression tests
        run: npx playwright test tests/e2e/visual.spec.js

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
