name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_ORIGIN: https://ourselves.cv
  SITE_BASE: /
  ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    if: github.repository == 'yuanxing689/YuanXingWebsite'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate IndexNow Key File
        if: env.INDEXNOW_KEY != ''
        run: printf '%s' "$INDEXNOW_KEY" > "dist/$INDEXNOW_KEY.txt"

      - name: Check dist exists
        run: test -d dist && ls -la dist || (echo "dist 目录不存在，请核对 npm run build 的输出目录"; exit 1)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ env.ARTIFACT_NAME }}

  deploy:
    needs: build
    if: github.repository == 'yuanxing689/YuanXingWebsite'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}

      - name: Submit URLs to IndexNow
        if: env.INDEXNOW_KEY != ''
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: ${{ format('{0}/sitemap.xml', env.SITE_ORIGIN) }}
          key: ${{ env.INDEXNOW_KEY }}